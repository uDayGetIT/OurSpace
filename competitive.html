<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>r/VirtualDateNight - Mumbai x Dubai</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b1426;
            color: #d7dadc;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            background: #0b1426;
        }

        .video-section {
            flex: 2;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .subreddit-header {
            background: #1a1a1b;
            border: 1px solid #343536;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 16px;
            position: relative;
        }

        .subreddit-header::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #ff4500;
            border-radius: 4px 0 0 4px;
        }

        .subreddit-header h1 {
            color: #ff4500;
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .subreddit-meta {
            color: #818384;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upvote-section {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .arrow {
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            border-radius: 2px;
            transition: all 0.2s;
        }

        .arrow:hover {
            background: #343536;
        }

        .upvoted {
            color: #ff4500;
        }

        .video-post {
            background: #1a1a1b;
            border: 1px solid #343536;
            border-radius: 4px;
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #818384;
        }

        .op-tag {
            background: #0079d3;
            color: white;
            padding: 2px 4px;
            border-radius: 2px;
            font-size: 10px;
        }

        .url-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #343536;
            background: #272729;
            color: #d7dadc;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .url-input::placeholder {
            color: #818384;
        }

        #videoPlayer {
            width: 100%;
            height: 400px;
            border-radius: 4px;
            background: #000;
            margin-bottom: 12px;
        }

        .video-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #272729;
            border-radius: 4px;
            border: 1px solid #343536;
        }

        .control-btn {
            background: #0079d3;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .control-btn:hover {
            background: #1484d6;
        }

        .chat-section {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            background: #1a1a1b;
            border: 1px solid #343536;
            border-radius: 4px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #272729;
            padding: 12px 16px;
            border-bottom: 1px solid #343536;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h3 {
            color: #d7dadc;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-indicator {
            background: #46d160;
            color: white;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 10px;
            animation: pulse 2s infinite;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            max-height: calc(100vh - 200px);
        }

        .message {
            margin-bottom: 12px;
            animation: messageSlide 0.3s ease;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .username {
            color: #0079d3;
            font-weight: 500;
            cursor: pointer;
        }

        .username.op {
            color: #ff4500;
        }

        .timestamp {
            color: #818384;
        }

        .message-content {
            background: #272729;
            border: 1px solid #343536;
            border-radius: 4px;
            padding: 8px 12px;
            color: #d7dadc;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.user1 .message-content {
            border-left: 3px solid #0079d3;
        }

        .message.user2 .message-content {
            border-left: 3px solid #ff4500;
        }

        .system-message .message-content {
            background: #2d5016;
            border: 1px solid #46d160;
            color: #46d160;
            text-align: center;
            font-style: italic;
        }

        .chat-input-container {
            display: flex;
            padding: 12px;
            gap: 8px;
            border-top: 1px solid #343536;
            background: #272729;
        }

        .chat-input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #343536;
            background: #1a1a1b;
            color: #d7dadc;
            font-size: 14px;
        }

        .chat-input::placeholder {
            color: #818384;
        }

        .chat-input:focus {
            outline: none;
            border-color: #0079d3;
        }

        .send-btn {
            background: #0079d3;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            color: white;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .send-btn:hover {
            background: #1484d6;
        }

        .rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        .rain-emoji {
            position: absolute;
            font-size: 24px;
            animation: rainFall 3s linear infinite;
            opacity: 0.8;
        }

        @keyframes rainFall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .award-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: #1a1a1b;
            border: 2px solid #ffd700;
            color: #d7dadc;
            padding: 24px;
            border-radius: 8px;
            text-align: center;
            z-index: 10000;
            animation: popupShow 0.5s ease forwards;
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.3);
        }

        @keyframes popupShow {
            to {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .award-popup h3 {
            color: #ffd700;
            margin-bottom: 12px;
            font-size: 16px;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
            }
            
            .video-section, .chat-section {
                flex: none;
            }
            
            #videoPlayer {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="rain-container" id="rainContainer"></div>
    
    <div class="container">
        <div class="video-section">
            <div class="subreddit-header">
                <h1>r/VirtualDateNight</h1>
                <div class="subreddit-meta">
                    <div>
                        <span>📍 Mumbai ↔️ Dubai • Online Now • 1,926km apart</span>
                    </div>
                    <div class="upvote-section">
                        <span class="arrow upvoted" onclick="addSystemMessage('🔥 This date got an upvote from the universe!')">▲</span>
                        <span style="color: #ff4500; font-weight: bold;">∞</span>
                        <span class="arrow">▼</span>
                    </div>
                </div>
            </div>
            
            <div class="video-post">
                <div class="post-header">
                    <span class="op-tag">OP</span>
                    <span>Posted by u/ud0_0</span>
                    <span>•</span>
                    <span>just now</span>
                    <span>•</span>
                    <span>📌 Pinned</span>
                </div>
                
                <input 
                    type="text" 
                    class="url-input" 
                    id="videoUrl" 
                    placeholder="Drop that YouTube link here... no rickrolls please 🙄"
                >
                
                <iframe 
                    id="videoPlayer"
                    src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1&controls=0"
                    frameborder="0" 
                    allowfullscreen>
                </iframe>
                
                <div class="video-controls">
                    <button class="control-btn" onclick="loadVideo()">Load Video</button>
                    <button class="control-btn" onclick="playPause()">Play/Pause</button>
                    <button class="control-btn" onclick="syncVideo()">Sync 🔄</button>
                    <button class="control-btn" onclick="giveAward()">Give Award 🏆</button>
                </div>
            </div>
        </div>
        
        <div class="chat-section">
            <div class="chat-container">
                <div class="chat-header">
                    <h3>Live Thread <span class="live-indicator">LIVE</span></h3>
                    <span style="font-size: 12px; color: #818384;">Sort by: Live</span>
                </div>
                
                <div class="chat-messages" id="chatMessages"></div>
                
                <div class="chat-input-container">
                    <input 
                        type="text" 
                        class="chat-input" 
                        id="messageInput" 
                        placeholder="What are your thoughts?"
                        onkeypress="handleKeyPress(event)"
                    >
                    <button class="send-btn" onclick="sendMessage()">Comment</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-database-compat.min.js"></script>
    
    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC-5glYkkh9TQVt4Rh0cJA9LU68SvJqNSg",
            authDomain: "momo-mumbai.firebaseapp.com",
            projectId: "momo-mumbai",
            storageBucket: "momo-mumbai.firebasestorage.app",
            messagingSenderId: "480537909895",
            appId: "1:480537909895:web:1a6806e44787074fd3b622",
            databaseURL: "https://momo-mumbai-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // Set your username here - change this for each person
        let currentUser = 'CompetitiveExpert973';
        let awardCount = 0;
        
        const rainTriggers = {
            'heart': '❤️',
            'love': '💕',
            'lol': '😂',
            'lmao': '🤣',
            'haha': '😆',
            'cute': '🥰',
            'beautiful': '✨',
            'amazing': '🌟',
            'wow': '😲',
            'fire': '🔥',
            'based': '💪',
            'cringe': '😬',
            'poggers': '🎉',
            'nice': '👌',
            'wholesome': '🤗'
        };

        const welcomeMessages = [
            {
                user: 'AutoModerator',
                content: 'Welcome to r/VirtualDateNight! Please be respectful and have fun! 🤖',
                isSystem: true
            },
            {
                user: 'ud0_0',
                content: 'Well well well, if it isn\'t CompetitiveExpert973... I see you\'ve accepted my challenge to the most epic virtual date of all time 😎',
                isUser1: true
            },
            {
                user: 'ud0_0', 
                content: 'Hope you brought your A-game because I spent way too much time making this Reddit-themed date setup instead of studying 😅',
                isUser1: true
            },
            {
                user: 'CompetitiveExpert973',
                content: 'WAIT WHAT?! You actually BUILT this?? 😱 I thought we were just going to watch YouTube like normal people!',
                isUser2: true
            },
            {
                user: 'CompetitiveExpert973',
                content: 'This is actually insane... Mumbai guy really said "let me just casually create a custom web app" 💀',
                isUser2: true
            },
            {
                user: 'ud0_0',
                content: 'What can I say? When CompetitiveExpert973 is involved, ordinary just won\'t do 😏',
                isUser1: true
            },
            {
                user: 'RandomRedditor42',
                content: 'Now kiss! 💋',
                isSystem: true
            }
        ];

        function loadVideo() {
            const url = document.getElementById('videoUrl').value;
            if (url.includes('youtube.com/watch?v=') || url.includes('youtu.be/')) {
                let videoId;
                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1].split('?')[0];
                } else {
                    videoId = url.split('v=')[1].split('&')[0];
                }
                const embedUrl = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&controls=0`;
                document.getElementById('videoPlayer').src = embedUrl;
                
                // Sync with other user
                syncVideoAction('load', { embedUrl, videoId, originalUrl: url });
                addSystemMessage('🎬 Video loaded! Syncing with your date...');
            }
        }

        function playPause() {
            syncVideoAction('playpause');
            addSystemMessage('⏯️ Play/Pause synced!');
            triggerRain('fire');
        }

        function syncVideo() {
            syncVideoAction('sync');
            addSystemMessage('🔄 Synchronizing... Perfect timing!');
            triggerRain('based');
        }

        function giveAward() {
            awardCount++;
            const awards = [
                { name: 'Wholesome Award', message: 'This date deserves a wholesome award! 🤗' },
                { name: 'Silver Award', message: 'Have some silver for this amazing setup! 🥈' },
                { name: 'Helpful Award', message: 'Most helpful virtual date setup ever! 🤝' },
                { name: 'Rocket Like', message: 'This date is going to the moon! 🚀' },
                { name: 'Heart Eyes Award', message: 'Absolutely adorable date night! 😍' }
            ];
            
            const award = awards[awardCount % awards.length];
            showAwardPopup(award.name, award.message);
            syncVideoAction('award', { award });
            triggerRain('wholesome');
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message) {
                // Send to Firebase
                const messageData = {
                    content: message,
                    username: currentUser,
                    timestamp: Date.now(),
                    userClass: currentUser === 'ud0_0' ? 'user1' : 'user2'
                };
                
                database.ref('messages').push(messageData);
                checkForTriggers(message);
                input.value = '';
            }
        }
        
        // Listen for new messages from Firebase
        function listenForMessages() {
            database.ref('messages').on('child_added', (snapshot) => {
                const messageData = snapshot.val();
                const isUser1 = messageData.userClass === 'user1';
                addMessage(messageData.content, messageData.username, messageData.userClass);
            });
        }
        
        // Video sync functions
        function syncVideoAction(action, data = {}) {
            database.ref('videoActions').push({
                action: action,
                data: data,
                timestamp: Date.now(),
                user: currentUser
            });
        }
        
        function listenForVideoActions() {
            database.ref('videoActions').on('child_added', (snapshot) => {
                const actionData = snapshot.val();
                if (actionData.user !== currentUser) { // Don't respond to your own actions
                    handleVideoAction(actionData);
                }
            });
        }
        
        function handleVideoAction(actionData) {
            switch(actionData.action) {
                case 'load':
                    document.getElementById('videoPlayer').src = actionData.data.embedUrl;
                    addSystemMessage(`🎬 ${actionData.user} loaded a new video!`);
                    break;
                case 'sync':
                    addSystemMessage(`🔄 ${actionData.user} synced the video!`);
                    break;
                case 'award':
                    triggerRain('wholesome');
                    addSystemMessage(`🏆 ${actionData.user} gave an award!`);
                    break;
            }
        }

        function addMessage(content, username, userClass, isSystem = false) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${userClass || ''} ${isSystem ? 'system-message' : ''}`;
            
            if (isSystem) {
                messageDiv.innerHTML = `
                    <div class="message-content">${content}</div>
                `;
            } else {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                messageDiv.innerHTML = `
                    <div class="message-header">
                        <span class="username ${username === 'ud0_0' ? 'op' : ''}">${username}</span>
                        <span class="timestamp">${timeStr}</span>
                    </div>
                    <div class="message-content">${content}</div>
                `;
            }
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addSystemMessage(text) {
            addMessage(text, 'System', '', true);
        }

        function checkForTriggers(message) {
            const lowerMessage = message.toLowerCase();
            
            Object.keys(rainTriggers).forEach(trigger => {
                if (lowerMessage.includes(trigger)) {
                    triggerRain(trigger);
                }
            });
        }

        function triggerRain(type) {
            const emoji = rainTriggers[type] || '✨';
            const rainContainer = document.getElementById('rainContainer');
            
            for (let i = 0; i < 12; i++) {
                setTimeout(() => {
                    createRainDrop(emoji);
                }, i * 150);
            }
        }

        function createRainDrop(emoji) {
            const rainContainer = document.getElementById('rainContainer');
            const drop = document.createElement('div');
            drop.className = 'rain-emoji';
            drop.textContent = emoji;
            drop.style.left = Math.random() * 100 + 'vw';
            drop.style.animationDuration = (Math.random() * 2 + 2) + 's';
            rainContainer.appendChild(drop);
            
            setTimeout(() => {
                drop.remove();
            }, 4000);
        }

        function showAwardPopup(awardName, message) {
            const popup = document.createElement('div');
            popup.className = 'award-popup';
            popup.innerHTML = `
                <h3>🏆 ${awardName}</h3>
                <p>${message}</p>
            `;
            document.body.appendChild(popup);
            
            setTimeout(() => {
                popup.remove();
            }, 3000);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Initialize welcome sequence
        function initializeWelcome() {
            welcomeMessages.forEach((msg, index) => {
                setTimeout(() => {
                    if (msg.isSystem) {
                        addSystemMessage(msg.content);
                    } else {
                        addMessage(msg.content, msg.user, msg.isUser1 ? 'user1' : 'user2');
                    }
                }, index * 2000);
            });
            
            // Add final system message
            setTimeout(() => {
                addSystemMessage('💡 Pro tip: Try typing "lol", "heart", "fire", or "wholesome" for special effects!');
            }, welcomeMessages.length * 2000 + 2000);
        }

        // Start the show!
        setTimeout(() => {
            initializeWelcome();
            // Initialize real-time features if Firebase is configured
            if (typeof firebase !== 'undefined' && firebaseConfig.apiKey !== "your-api-key-here") {
                listenForMessages();
                listenForVideoActions();
                addSystemMessage('🔗 Real-time connection established!');
            } else {
                addSystemMessage('⚠️ Demo mode - Set up Firebase for real-time features!');
            }
        }, 1000);
    </script>
</body>
</html>
