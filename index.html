<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to February 13, 2026 ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ec4899, #f43f5e, #ef4444);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            color: white;
            max-width: 600px;
            width: 100%;
        }

        .heart {
            font-size: 80px;
            animation: pulse 1.5s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .date {
            font-size: 20px;
            opacity: 0.9;
            margin-bottom: 40px;
            font-weight: 500;
        }

        .countdown {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 16px;
            min-width: 90px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .number {
            font-size: 52px;
            font-weight: bold;
            display: block;
            line-height: 1;
        }

        .label {
            font-size: 12px;
            text-transform: uppercase;
            margin-top: 10px;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .message {
            font-size: 18px;
            font-style: italic;
            opacity: 0.9;
        }

        @media (max-width: 480px) {
            h1 { font-size: 32px; }
            .number { font-size: 44px; }
            .box { min-width: 75px; padding: 20px; }
            .heart { font-size: 60px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">❤️</div>
        <h1>Time Until We Meet</h1>
        <div class="date">February 13, 2026</div>
        
        <div class="countdown">
            <div class="box">
                <span class="number" id="days">00</span>
                <div class="label">Days</div>
            </div>
            <div class="box">
                <span class="number" id="hours">00</span>
                <div class="label">Hours</div>
            </div>
            <div class="box">
                <span class="number" id="minutes">00</span>
                <div class="label">Minutes</div>
            </div>
            <div class="box">
                <span class="number" id="seconds">00</span>
                <div class="label">Seconds</div>
            </div>
        </div>

        <p class="message">Can't wait to see you! 💕</p>
    </div>

    <script>
        function pad(num) {
            return num < 10 ? '0' + num : num;
        }

        function updateCountdown() {
            // Target: February 13, 2026 at 00:00:00
            var target = new Date(2026, 1, 13, 0, 0, 0, 0);
            var now = new Date();
            var diff = target.getTime() - now.getTime();

            if (diff > 0) {
                var days = Math.floor(diff / (1000 * 60 * 60 * 24));
                var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                var seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = pad(days);
                document.getElementById('hours').textContent = pad(hours);
                document.getElementById('minutes').textContent = pad(minutes);
                document.getElementById('seconds').textContent = pad(seconds);
            } else {
                document.querySelector('h1').textContent = "Today's the Day! 🎉";
                document.querySelector('.countdown').innerHTML = '<div style="font-size: 56px; font-weight: bold;">❤️ Finally! ❤️</div>';
                document.querySelector('.message').textContent = '';
            }
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
