<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to February 13th ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ec4899, #f43f5e, #ef4444);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            color: white;
            max-width: 600px;
        }

        .heart {
            font-size: 60px;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .date {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 40px;
            font-weight: 500;
        }

        .countdown {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            min-width: 75px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .number {
            font-size: 48px;
            font-weight: bold;
            display: block;
            line-height: 1;
        }

        .label {
            font-size: 11px;
            text-transform: uppercase;
            margin-top: 8px;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .message {
            font-size: 16px;
            font-style: italic;
            opacity: 0.9;
        }

        button {
            background: white;
            color: #f43f5e;
            border: none;
            padding: 14px 32px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        @media (max-width: 480px) {
            h1 { font-size: 28px; }
            .number { font-size: 40px; }
            .box { min-width: 65px; padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">❤️</div>
        <h1 id="title">Time Until We Meet</h1>
        <div class="date">February 13, 2025</div>
        
        <div class="countdown" id="countdown">
            <div class="box">
                <span class="number" id="days">00</span>
                <div class="label">Days</div>
            </div>
            <div class="box">
                <span class="number" id="hours">00</span>
                <div class="label">Hours</div>
            </div>
            <div class="box">
                <span class="number" id="minutes">00</span>
                <div class="label">Minutes</div>
            </div>
            <div class="box">
                <span class="number" id="seconds">00</span>
                <div class="label">Seconds</div>
            </div>
        </div>

        <p class="message">Can't wait to see you! 💕</p>
        <button id="shareBtn">📤 Share with GF</button>
    </div>

    <script>
        function updateCountdown() {
            const targetDate = new Date(2025, 1, 13, 0, 0, 0).getTime();
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = String(days).padStart(2, '0');
                document.getElementById('hours').textContent = String(hours).padStart(2, '0');
                document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
                document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
            } else {
                document.getElementById('title').textContent = "Today's the Day! ❤️";
                document.getElementById('countdown').innerHTML = '<div style="font-size: 48px;">🎉 It\'s Today! 🎉</div>';
            }
        }

        document.getElementById('shareBtn').addEventListener('click', function() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: 'Countdown to February 13th ❤️',
                    text: 'Check out our countdown! Can\'t wait to see you! 💕',
                    url: url
                }).catch(function(err) {
                    console.log('Share cancelled');
                });
            } else {
                navigator.clipboard.writeText(url).then(function() {
                    alert('Link copied to clipboard! Send it to your GF 💕');
                }).catch(function() {
                    alert('Link: ' + url);
                });
            }
        });

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
